stages:
  - test

ui-tests:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BASE_URL: "https://foodgram-frontend-1.foodgram.education-services.ru"
    # Необязательно: адрес бэкенда API. По умолчанию выводится из BASE_URL (frontend → backend)
    API_URL: ""
  before_script:
    - |
      if [ -z "$BASE_URL" ]; then
        echo "BASE_URL не задан. Settings -> CI/CD -> Variables -> Add variable"
        exit 1
      fi
    - docker info
  script:
    - docker pull selenoid/chrome:128.0
    - docker compose up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose cp tests:/app/allure_results ./allure_results || true
    - docker compose down || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - allure_results/
